<div class="labyrinth-canvas-layout">
  <form class="params-form" [formGroup]="paramsForm" (ngSubmit)="onGenerate()">
    <div class="params-grid">
      <mat-form-field appearance="outline" class="param-field" subscriptSizing="dynamic">
        <mat-label>Wall length</mat-label>
        <input matInput type="number" formControlName="step" min="1" max="100" />
        <mat-hint>1–100</mat-hint>
      </mat-form-field>
      <mat-form-field appearance="outline" class="param-field" subscriptSizing="dynamic">
        <mat-label>Probability</mat-label>
        <input matInput type="number" formControlName="probability" min="1" max="100" />
        <mat-hint>1–100</mat-hint>
      </mat-form-field>
      <mat-form-field appearance="outline" class="param-field" subscriptSizing="dynamic">
        <mat-label>Depth</mat-label>
        <input matInput type="number" formControlName="depth" min="1" max="1000" />
        <mat-hint>1–1000</mat-hint>
      </mat-form-field>
      <mat-form-field appearance="outline" class="param-field" subscriptSizing="dynamic">
        <mat-label>L/R Length</mat-label>
        <input matInput type="number" formControlName="plr" min="1" max="100" />
        <mat-hint>1–100</mat-hint>
      </mat-form-field>
    </div>
    <button
      mat-flat-button
      color="primary"
      type="submit"
      class="generate-btn"
      [disabled]="paramsForm.invalid || generating()"
    >
      @if (generating()) {
        Generating…
      } @else {
        {{ generateLabel() }}
      }
    </button>
  </form>

  <div #canvasContainer class="canvas-container">
    <canvas #canvas class="labyrinth-canvas"></canvas>
  </div>
</div>
