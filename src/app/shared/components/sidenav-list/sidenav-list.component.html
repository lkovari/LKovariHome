<div class="side-nav-layout">
  <mat-nav-list class="mat-side-nav-style">
    <a
      mat-list-item
      [routerLink]="['/layout-pages/home']"
      (click)="onSidenavClose()"
    >
      <fa-icon [icon]="['fas', 'home']" />
      <span class="nav-caption">Home</span>
    </a>
    <a
      mat-list-item
      [routerLink]="['/layout-pages/about-me']"
      (click)="onSidenavClose()"
    >
      <fa-icon [icon]="['fas', 'person']" />
      <span class="nav-caption">About Me</span>
    </a>
    <a
      mat-list-item
      [routerLink]="['/layout-pages/awards']"
      (click)="onSidenavClose()"
    >
      <fa-icon [icon]="['fas', 'award']" /><span class="nav-caption">Awards</span>
    </a>
    <a
      mat-list-item
      href="https://lkovari.github.io/KLHome"
      (click)="onSidenavClose()"
    >
      <fa-icon [icon]="['fas', 'globe']" /><span class="nav-caption">Tech Stack & Codes</span>
    </a>
  </mat-nav-list>
  <div class="bottom-menu-section">
    <p-tieredmenu styleClass="slide-menu-style"
      [model]="menuItems"
     />
  </div>
</div>
