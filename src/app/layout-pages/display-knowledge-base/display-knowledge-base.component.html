<div class="knowledge-base-page">
  <header class="knowledge-base-header">
    <h1 class="knowledge-base-title">{{ pageTitle() }}</h1>
  </header>

  <div class="knowledge-base-viewer" #viewer (click)="onViewerClick($event)">
    @if (loading()) {
      <p class="knowledge-base-status">Loading…</p>
    }

    @if (errorMessage(); as message) {
      <div class="knowledge-base-error">
        <p>{{ message }}</p>
      </div>
    }

    @if (markdown(); as content) {
      <markdown
        class="knowledge-base-markdown"
        [data]="content"
        [disableSanitizer]="true"
      ></markdown>
    }
  </div>

  <footer class="knowledge-base-footer">
    <button mat-flat-button color="primary" type="button" [routerLink]="['/layout-pages/home']">
      Back
    </button>
  </footer>
</div>
